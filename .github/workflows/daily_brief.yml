name: AI 搞钱雷达每日简报

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00，GitHub 定时任务可能延迟。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅生成简报并上传预览，不发送邮件（仍调用模型 API）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-ai-brief
  cancel-in-progress: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline checks
        run: python -m unittest discover -s tests -v
      - name: Generate and send daily brief
        run: python main.py
      - name: Save brief preview and feed health
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-brief-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
